[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "editor-sped"
description = "Ferramenta para auxiliar a criação e edição de arquivos do SPED brasileiro"

authors = [{ name = "Davi Augusto Moreira da Silva", email = "daviamsilva@hotmail.com" }]
maintainers = [{ name = "Davi Augusto Moreira da Silva", email = "daviamsilva@hotmail.com" }]

readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }

keywords = [ "sped", "fiscal", "efd-fiscal", "contribuicoes", "efd-contribuicoes", "brasil", "receita-federal", "text-processing" ]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: General",
]

dependencies = []
requires-python = ">=3.11"

dynamic = ["version"]


[project.urls]
Homepage = "https://github.com/DaviAMSilva/editor_sped"
Repository = "https://github.com/DaviAMSilva/editor_sped"
Issues = "https://github.com/DaviAMSilva/editor_sped/issues"
Changelog = "https://github.com/DaviAMSilva/editor_sped/releases"


[project.optional-dependencies]
DEV = [
    "invoke",
    "autopep8",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-profiling",
    "snakeviz",
]
JUPYTER = [
    "ipykernel",
    "ipywidgets"
]


[tool.setuptools]
include-package-data = true


[tool.setuptools.dynamic]
version = { attr = "editor_sped.__version__" }


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]


[tool.autopep8]
max_line_length = 160
ignore = ["E303"]


[tool.pylint]
max-args = 10
max-attributes = 15
max-line-length = 160
min-similarity-lines = 10
disable = ["C0114", "C0115", "C0116"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"


[tool.check-wheel-contents]
toplevel = ["editor_sped"]

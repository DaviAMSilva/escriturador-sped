[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "escriturador-sped"
version = "1.3.0"
description = "Biblioteca para auxiliar a criação e edição de arquivos de escrituração do SPED brasileiro"

authors = [
    { name = "Davi Augusto Moreira da Silva", email = "daviamsilva@hotmail.com" },
]
maintainers = [
    { name = "Davi Augusto Moreira da Silva", email = "daviamsilva@hotmail.com" },
]

readme = "README.md"
license = "MIT"

keywords = [
    "python",
    "sped",
    "escrituração",
    "efd-icms-ipi",
    "efd-contribuições",
    "sped-fiscal",
    "sped-contribuições",
    "receita-federal",
    "contabilidade",
    "brasil",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: General",
]

dependencies = []
requires-python = ">=3.12"


[project.urls]
Homepage = "https://github.com/DaviAMSilva/escriturador-sped"
Repository = "https://github.com/DaviAMSilva/escriturador-sped"
Issues = "https://github.com/DaviAMSilva/escriturador-sped/issues"
Changelog = "https://github.com/DaviAMSilva/escriturador-sped/releases"


[project.optional-dependencies]
DEV = [
    "invoke",
    "autopep8",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-profiling",
    "snakeviz",
]


[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
escriturador_sped = ["modulos/**/*.json"]


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]


[tool.autopep8]
max_line_length = 160
ignore = ["E303"]


[tool.pylint]
max-line-length = 160
min-similarity-lines = 10
disable = ["C0114", "C0115", "C0116"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"


[tool.check-wheel-contents]
toplevel = ["escriturador_sped"]

[tool.coverage.run]
omit = ["tests/*", "tasks.py"]

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Visualizador de Registros - Editor SPED</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="efd_info.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 25%;
        }

        select {
            margin-bottom: 20px;
            padding: 5px;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        table tr td:nth-child(1) {
            text-align: center;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .registro {
            cursor: pointer;
            color: #007BFF;
            position: relative;
            scroll-margin-top: 2em;
        }

        .registro:hover::after {
            content: attr(data-title);
            white-space: pre-wrap;
            text-align: left;
            position: absolute;
            top: 100%;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            font-size: .9em;
            z-index: 1000;
            width: 700px;
        }

        .campo {
            cursor: pointer;
            color: #28A745;
            position: relative;
            scroll-margin-top: 2em;
        }

        .campo:hover::after {
            content: attr(data-title);
            white-space: pre-wrap;
            position: absolute;
            top: 100%;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            font-size: .9em;
            z-index: 1000;
            width: 700px;
        }

        .campo small {
            font-size: 0.70em;
            margin-left: 1px;
            color: darkgreen;
            user-select: none;
        }

        .selecao {
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .campo:not(:first-child)::before {
                content: "\A";
                white-space: pre;
            }

            .registro:hover::after,
            .campo:hover::after {
                font-size: 0.75em;
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <span class="selecao">
        Escolha o tipo de escrituração:
        <select name="efd_tipo" id="efd_tipo" onchange="toggleVisibility()">
            <option value="efd_icms_ipi">EFD_ICMS_IPI</option>
            <option value="efd_pis_cofins">EFD_PIS_COFINS</option>
        </select>
    </span>
    <div id="container-principal">
        <div id="container-efd_icms_ipi">
            <table>
                <thead>
                    <tr>
                        <th>Registro</th>
                        <th>Campos</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <div id="container-efd_pis_cofins">
            <table>
                <thead>
                    <tr>
                        <th>Registro</th>
                        <th>Campos</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const EFD_ORDEM_BLOCOS = {
            "efd_icms_ipi": ["0", "B", "C", "D", "E", "G", "H", "K", "1", "9"],
            "efd_pis_cofins": ["0", "A", "C", "D", "F", "I", "M", "P", "1", "9"]
        }



        function toggleVisibility() {
            const valorAtual = document.getElementById("efd_tipo").value;
            document.getElementById("container-efd_icms_ipi").style.display = valorAtual === "efd_icms_ipi" ? "block" : "none";
            document.getElementById("container-efd_pis_cofins").style.display = valorAtual === "efd_pis_cofins" ? "block" : "none";
        }
        toggleVisibility();



        // Testa se o arquivo foi carregado corretamente
        if (typeof EFD_INFO === "undefined") {
            const mensagemAviso = "O arquivo efd_info.json não foi encontrado. Tenha certeza que o arquivo foi gerado corretamente.";
            const elementoAviso = document.createElement("div");
            elementoAviso.style.color = "red";
            elementoAviso.textContent = mensagemAviso;
            document.body.appendChild(elementoAviso);
            throw new Error("Erro ao carregar o arquivo efd_info.json (EFD_INFO é undefined)");
        }



        for (const tipo of Object.keys(EFD_ORDEM_BLOCOS)) {
            const registros = EFD_INFO[tipo].registros;

            const registros_ordenados = Object.keys(registros).sort((a, b) => {
                const chaveA = EFD_ORDEM_BLOCOS[tipo].indexOf(a[0]) * 1000 + parseInt(a.slice(1, 4));
                const chaveB = EFD_ORDEM_BLOCOS[tipo].indexOf(b[0]) * 1000 + parseInt(b.slice(1, 4));
                return chaveA - chaveB;
            });

            for (const nome_registro of registros_ordenados) {
                const { campos, ...dados_registro } = registros[nome_registro];

                const trLinha = document.createElement("tr");
                const tdRegistro = document.createElement("td");
                const aRegistro = document.createElement("a");

                aRegistro.id = nome_registro;
                aRegistro.href = `#${nome_registro}`;
                aRegistro.textContent = nome_registro;
                aRegistro.setAttribute("data-title", JSON.stringify(dados_registro, null, 2));
                aRegistro.classList.add("registro");
                tdRegistro.appendChild(aRegistro);

                trLinha.appendChild(tdRegistro);

                const tdCampos = document.createElement("td");
                const spanLinhaCampos = document.createElement('span');
                campos.forEach(campo => {
                    const numeroFormatado = String(campo.numero).padStart(2, "0");

                    const spanCampo = document.createElement('span');
                    spanCampo.id = `${nome_registro}-${numeroFormatado}`;
                    spanCampo.className = 'campo';
                    spanCampo.setAttribute('data-title', JSON.stringify(campo, null, 2));
                    spanCampo.innerHTML = `${campo.nome}`;

                    const spanCampoNumero = document.createElement("small");
                    spanCampoNumero.innerHTML = `<a href='#${nome_registro}-${numeroFormatado}'>${numeroFormatado}</a>`
                    spanCampo.appendChild(spanCampoNumero);

                    spanLinhaCampos.appendChild(document.createElement("wbr"));
                    spanLinhaCampos.appendChild(document.createTextNode('|'));
                    spanLinhaCampos.appendChild(spanCampo);

                    tdCampos.appendChild(spanLinhaCampos);
                });
                spanLinhaCampos.appendChild(document.createTextNode('|'));

                trLinha.appendChild(tdCampos);

                document.querySelector(`#container-${tipo} tbody`).appendChild(trLinha);
            }
        }
    </script>
</body>

</html>
